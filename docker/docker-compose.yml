services:
  explorer:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: autonomous-explorer
    network_mode: "host"
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ros2 launch autonomous_explorer full_system.launch.py world:=${WORLD_FILE:-warehouse.sdf}

  explorer-dev:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: autonomous-explorer-dev
    network_mode: "host"
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../src:/ros2_ws/src
    command: ros2 launch autonomous_explorer full_system.launch.py world:=${WORLD_FILE:-warehouse.sdf}
